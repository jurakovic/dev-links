name: Update Posts (dev-news)

permissions:
  contents: write

on:
  #schedule:
  #  - cron: '0 */6 * * *' # https://console.cron-job.org/jobs/7705033
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch ("dev-news")'
        required: false
        default: 'dev-news'
        type: string
      content_branch:
        description: 'Content branch ("master"): blogs.json, links on the news page'
        required: false
        default: 'master'
        type: string

# The branch the workflow runs from supplies the scripts, the content branch blogs.json,
# and the target branch the posts (read and written)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch || 'dev-news' }}
          fetch-depth: 0
          token: ${{ secrets.DEV_LINKS_PAT }}

      - name: Git Config
        run: |
          git config core.fileMode false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: Prepare Scripts
        env:
          CONTENT_BRANCH: ${{ inputs.content_branch || 'master' }}
        run: |
          # get content
          git restore --source "origin/$CONTENT_BRANCH" -- blogs.json
          # get scripts
          git restore --source origin/${{ github.ref_name }} -- src/gen_news.js
          git restore --source origin/${{ github.ref_name }} -- src/update_posts.sh
          git restore --source origin/${{ github.ref_name }} -- src/fix_post_times.js
          chmod +x ./src/update_posts.sh
        shell: bash

      - name: Build
        env:
          CONTENT_BRANCH: ${{ inputs.content_branch || 'master' }}
        run: |
          ./src/update_posts.sh
          node src/gen_news.js "$CONTENT_BRANCH" # links to master content point to the content branch

          # cleanup temp scripts
          rm blogs.json
          rm src/gen_news.js
          rm src/update_posts.sh
          rm src/fix_post_times.js
          rmdir src

          git status -s
          git add .
          git diff --cached --quiet --exit-code
          if [ $? -eq 0 ]; then echo "No git changes"; exit 0; fi

          git commit -m "Update posts"
          git push
        shell: bash {0}
